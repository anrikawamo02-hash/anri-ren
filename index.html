<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#15171b" />
  <title>蓮</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app" id="app">
    <header class="topbar">
      <div class="brand">
        <span class="dot" aria-hidden="true"></span>
        <div>
          <div class="name">蓮</div>
          <div class="status" id="status">待ってる</div>
        </div>
      </div>

      <div class="toolbar" aria-label="テーマ">
        <button class="pill active" id="autoBtn" type="button">自動</button>
        <button class="pill" id="blackBtn" type="button">ブラック</button>
        <button class="pill" id="lavBtn" type="button">ラベンダー</button>
      </div>
    </header>

    <section class="portrait-wrap" aria-label="蓮の表示エリア">
      <div class="portrait">
        <img src="ren.png" alt="蓮のメインビジュアル">
      </div>
    </section>

    <section class="conversation" aria-live="polite">
      <div class="bubble" id="bubble">
        <div class="who">蓮</div>
        杏里が話しかけるまで、ここで待ってるで。
      </div>
    </section>

    <footer class="composer">
      <div class="composer-inner">
        <div class="controls">
          <button class="pill active" id="voiceBtn" type="button">🔊 音声ON</button>
          <button class="pill" id="lipBtn" type="button">口パク練習</button>
        </div>

        <div class="sendbar">
          <textarea id="msg" rows="1" placeholder="蓮に話しかける…"></textarea>
          <button class="iconbtn" id="micBtn" type="button" aria-label="マイク">🎤</button>
          <button class="iconbtn primary" id="sendBtn" type="button" aria-label="送信">↑</button>
        </div>

        <p class="notice">試作版：AI・音声APIにはまだ接続していません（課金なし）</p>
      </div>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
